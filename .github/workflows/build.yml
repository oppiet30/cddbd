name: C build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Configure non-interactively
        run: |
          printf '\n\n\nn\nn\n' | sh ./config.sh
          test -s configurables.h
          test -s access.h
          test -s secure.c
      - name: Build in parallel
        run: make -j4 cf=-Werror
      - name: Verify executable
        run: test -x ./cddbd && file ./cddbd
      - name: Regression checks
        run: make check cf=-Werror
      - name: C17 regression checks
        run: make check CFLAGS="-std=gnu17 -O2 -Wall -Wextra -Werror"
      - name: Memory and undefined-behavior checks
        run: make check CFLAGS="-std=gnu17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
